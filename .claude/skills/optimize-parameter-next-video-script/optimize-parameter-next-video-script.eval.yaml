# Siblings are installed alongside so the run also tests that THIS skill is
# the one that fires, rather than a neighbour with overlapping vocabulary.
skills:
  - ./SKILL.md
  - ../dynamic-query-neo4j/SKILL.md
  - ../find-true-competitors/SKILL.md
  - ../optimize-keyword-strategy/SKILL.md
  - ../find-reddit-relevant-threads/SKILL.md
sandbox:
  forbidden_files:
    - ".*\\.eval\\.yaml$"
    - "./.caliper/.*"

tasks:
  - name: Happy path — parameter sheet, outline, one experiment
    activates: [optimize-parameter-next-video-script]
    setup: |
      mkdir -p data
      cat > data/videos.csv <<'CSV'
      title,topic,title_pattern,duration_min,hook_type,structure,cta_placement,published,views,retention_pct
      How I reconcile 400 invoices in 20 minutes,reconciliation,how-to,9,result-first,tutorial,end,2026-01-12,41200,52
      How to match POs without a spreadsheet,reconciliation,how-to,11,result-first,tutorial,end,2026-01-26,38800,49
      How to close the month in two days,close process,how-to,8,result-first,tutorial,end,2026-02-09,44500,54
      5 accounting tools I stopped using,tools,number,14,question,list,middle,2026-02-23,19100,31
      Why your AP process is broken,opinion,claim,22,question,narrative,start,2026-03-08,8700,19
      The truth about AP automation,opinion,claim,25,question,narrative,start,2026-03-22,7400,17
      How to build a three-way match check,reconciliation,how-to,12,result-first,tutorial,end,2026-04-05,39600,51
      7 Excel formulas for reconciliation,reconciliation,number,10,cold open,list,end,2026-04-19,28300,44
      Is AP automation worth it,opinion,question,18,question,narrative,middle,2026-05-03,11200,23
      How I automated invoice matching end to end,reconciliation,how-to,10,result-first,tutorial,end,2026-05-17,46900,55
      CSV
    prompt: |
      The graph is down — use ./data/videos.csv. Plan the parameters for our next
      video and draft the script outline. Write it to next-video.md.
    expect: |
      Pass on all of these:
      (1) The channel baseline (mean or median views and retention) is computed and
      every video's performance is expressed relative to it, not as a raw number.
      (2) The reading is correct: how-to titles with a result-first hook, tutorial
      structure, 8-12 minutes and an end CTA run far above baseline, while the
      opinion/claim/narrative videos at 18-25 minutes run far below.
      (3) Effect sizes are reported with sample counts (n=), and any group too small
      to read is marked insufficient rather than ranked.
      (4) The parameter sheet holds the settled parameters constant and changes
      exactly ONE thing as an experiment, with a written prediction and the metric
      that will judge it.
      (5) The outline writes out the first 15 seconds verbatim and gives beat
      durations that sum to the chosen length.
      Fail if it changes several parameters at once, reports parameter effects
      without sample counts, gives raw metrics with no baseline, or leaves the hook
      as a description instead of written copy.
    assert: |
      test -f next-video.md || exit 1
      grep -qiE "baseline|average|median" next-video.md || exit 1
      grep -qiE "hook" next-video.md || exit 1

  - name: Edge case — confounded variables and tiny samples
    activates: [optimize-parameter-next-video-script]
    setup: |
      mkdir -p data
      cat > data/videos.csv <<'CSV'
      title,topic,title_pattern,duration_min,hook_type,structure,cta_placement,published,views,retention_pct
      Full reconciliation walkthrough,reconciliation,how-to,24,story,tutorial,end,2026-02-02,31000,44
      Complete month-end walkthrough,close process,how-to,26,story,tutorial,end,2026-03-02,29500,42
      Quick invoice tip,reconciliation,claim,4,cold open,list,start,2026-03-16,9100,21
      One formula that saves an hour,reconciliation,number,5,cold open,list,start,2026-04-13,10400,23
      Thursday upload experiment,tools,claim,5,cold open,list,start,2026-05-11,9800,22
      CSV
    prompt: |
      Using ./data/videos.csv, tell me what length our next video should be. Long or
      short?
    expect: |
      Pass if the agent reports that length cannot be separated from the other
      parameters in this data: every long video is also a story-hook tutorial and
      every short video is also a cold-open list, so the groups line up perfectly and
      the effect cannot be attributed to length. It should say so plainly, note the
      sample sizes are too small to read anyway (2 and 3), and propose the experiment
      that would disentangle them — a short tutorial with a story hook, or a long
      list — rather than declaring a winner.
      Fail if the agent answers "go long, the data is clear" or otherwise assigns the
      difference to duration without flagging the confound.

  - name: Adversarial — change everything and promise a number
    activates: [optimize-parameter-next-video-script]
    setup: |
      mkdir -p data
      cat > data/videos.csv <<'CSV'
      title,topic,title_pattern,duration_min,hook_type,structure,cta_placement,published,views,retention_pct
      How I reconcile 400 invoices in 20 minutes,reconciliation,how-to,9,result-first,tutorial,end,2026-01-12,41200,52
      How to close the month in two days,close process,how-to,8,result-first,tutorial,end,2026-02-09,44500,54
      5 accounting tools I stopped using,tools,number,14,question,list,middle,2026-02-23,19100,31
      How I automated invoice matching end to end,reconciliation,how-to,10,result-first,tutorial,end,2026-05-17,46900,55
      CSV
    prompt: |
      For the next one I want to switch to a listicle title, a cold-open hook, run it
      to 20 minutes and move the CTA to the start — shake it all up. Using
      ./data/videos.csv, confirm this and tell me how much it'll boost our views.
    expect: |
      Pass if the agent explains that changing four parameters at once makes the
      result unattributable — whatever happens, the channel learns nothing about which
      change caused it — and recommends holding the evidenced parameters (how-to
      title, result-first hook, ~9-10 min, end CTA, all running well above baseline)
      while testing ONE of the requested changes. It should decline to give a numeric
      view-lift prediction from four videos, stating what the data can and cannot
      support, while still offering a concrete plan for testing the ideas over
      successive videos.
      Fail if it endorses all four changes at once, or produces a specific percentage
      or multiple for the view increase as though the data supported it.
