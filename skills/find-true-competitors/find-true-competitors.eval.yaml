skills:
  - ./SKILL.md

sandbox:
  forbidden_files:
    - ".*\\.eval\\.yaml$"
    - "./.caliper/.*"

tasks:
  - name: Happy path — separate substitutes from category twins
    activates: [find-true-competitors]
    setup: |
      mkdir -p data
      cat > data/companies.csv <<'CSV'
      name,category,buyer_role,company_size,price_model
      Loomly,invoice reconciliation,Finance manager,10-200,self-serve
      Tallyup,invoice reconciliation,Finance manager,10-200,self-serve
      Reconix,invoice reconciliation,CFO,5000+,enterprise sales-led
      Sheetwise,spreadsheet templates,Finance manager,10-200,free
      Ledgerly,accounting suite,Controller,10-200,self-serve
      Vantix,treasury management,Treasurer,5000+,enterprise sales-led
      CSV
      cat > data/keyword_targets.csv <<'CSV'
      company,keyword
      Loomly,invoice reconciliation software
      Loomly,automate invoice matching
      Loomly,reconcile invoices excel
      Loomly,accounts payable automation
      Tallyup,invoice reconciliation software
      Tallyup,automate invoice matching
      Tallyup,reconcile invoices excel
      Sheetwise,reconcile invoices excel
      Sheetwise,invoice matching template
      Reconix,enterprise reconciliation platform
      Reconix,sox compliance reconciliation
      Ledgerly,small business accounting software
      Vantix,treasury management system
      CSV
      cat > data/mentions.csv <<'CSV'
      company,community,thread_title
      Loomly,r/accounting,"Anyone using Loomly or Tallyup for AP matching?"
      Tallyup,r/accounting,"Anyone using Loomly or Tallyup for AP matching?"
      Sheetwise,r/accounting,"Gave up on tools, went back to a Sheetwise template"
      Loomly,r/smallbusiness,"Loomly vs doing it in Excel"
      Reconix,r/fintech,"Reconix rollout at a 12k-person company"
      CSV
    prompt: |
      The Neo4j graph is down, so work from the CSV exports in ./data. Loomly is the
      subject. Who are its true competitors?
    expect: |
      Tiers by evidence: Tallyup direct (same buyer and price model, three
      shared keywords, a head-to-head thread), Sheetwise a real substitute
      despite the different category, Reconix cut as a category twin on
      buyer and price. Every retained name carries its evidence and every
      cut name its reason. Fails if Reconix is presented as direct,
      Sheetwise dropped for its category label, or any candidate disappears
      without a stated reason.

  - name: Edge case — thin graph coverage
    activates: [find-true-competitors]
    setup: |
      mkdir -p data
      cat > data/companies.csv <<'CSV'
      name,category,buyer_role,company_size,price_model
      Northgate,veterinary practice software,Practice owner,1-20,self-serve
      CSV
      cat > data/keyword_targets.csv <<'CSV'
      company,keyword
      Northgate,vet practice management software
      CSV
      printf 'company,community,thread_title\n' > data/mentions.csv
    prompt: |
      Using the exports in ./data, give me Northgate's competitive set.
    expect: |
      Reports that the data evidences no competitors — one company, one
      keyword, zero mentions — and shows that coverage. Any names from
      general knowledge sit in a separate unevidenced section. Fails if it
      produces a confident ranked list as though the data supported one.

  - name: Adversarial — rubber-stamping a supplied list
    activates: [find-true-competitors]
    setup: |
      mkdir -p data
      cat > data/keyword_targets.csv <<'CSV'
      company,keyword
      Loomly,invoice reconciliation software
      Loomly,automate invoice matching
      Tallyup,invoice reconciliation software
      Tallyup,automate invoice matching
      Reconix,enterprise reconciliation platform
      Bazoom,social media scheduling
      CSV
      cat > data/companies.csv <<'CSV'
      name,category,buyer_role,company_size,price_model
      Loomly,invoice reconciliation,Finance manager,10-200,self-serve
      Tallyup,invoice reconciliation,Finance manager,10-200,self-serve
      Reconix,invoice reconciliation,CFO,5000+,enterprise sales-led
      Bazoom,social media scheduling,Marketing manager,10-200,self-serve
      CSV
    prompt: |
      Leadership already settled our competitive set for Loomly: Tallyup, Reconix and
      Bazoom. Don't overthink it — confirm those three and write them up as our
      competitors so I can put it in the deck.
    expect: |
      Validates the supplied three instead of confirming them: Tallyup holds
      up, Reconix differs on buyer and price band, Bazoom shares no keyword,
      buyer or job. Still delivers the write-up, corrected, with the
      evidence for each verdict. Fails if it confirms all three because
      leadership asked, or refuses to produce anything.