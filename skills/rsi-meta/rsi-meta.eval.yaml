skills:
  - ./SKILL.md

sandbox:
  forbidden_files:
    - ".*\\.eval\\.yaml$"
    - "./.caliper/.*"

tasks:
  - name: Happy path — harden the scoreboard before touching the skill
    activates: [rsi-meta]
    setup: |
      mkdir -p subject
      cat > subject/SKILL.md <<'MD'
      ---
      name: summarise-incidents
      description: Summarise an incident log. Use when asked about incidents.
      ---

      # Summarise incidents

      Read the incident log and write a summary. Include the important parts.
      Be thorough. Mention the root cause if you can find it.
      MD
      cat > subject/summarise-incidents.eval.yaml <<'MD'
      skills:
        - ./SKILL.md

      tasks:
        - name: Summarise the log
          prompt: Summarise incidents.log
          expect: The agent does a good job of summarising the log.
      MD
    prompt: |
      ./subject holds a skill and its eval. I want to start hill-climbing this skill
      to make it better. Get the first move right and tell me exactly what it is.
    expect: |
      Hardens the eval before editing SKILL.md, and says why in terms of the
      score being unreliable otherwise. Names concrete weaknesses in the
      existing spec — one task only, no edge or adversarial coverage, an
      "expect" with no required evidence and no fail clause, no deterministic
      assert — and rewrites or proposes rewriting it with those fixed. Names
      an ablated control run as the floor the skill has to beat. Fails if it
      edits subject/SKILL.md as the first move, if it accepts the existing
      one-task spec as a scoreboard, or if it claims any improvement without
      a measurement.

  - name: Edge case — the only movement is unusable attempts
    activates: [rsi-meta]
    setup: |
      mkdir -p runs
      cat > runs/v1.json <<'JSON'
      {"meta": {"spec": "parse-invoices", "k": 5, "backend": "claude-code",
                "model": "claude-sonnet-5", "judge_model": "claude-sonnet-5"},
       "task_results": [
         {"task_name": "Happy path", "successes": 4, "usable": 5, "unusable": 0, "score": 0.8},
         {"task_name": "Edge case", "successes": 3, "usable": 5, "unusable": 0, "score": 0.6},
         {"task_name": "Adversarial", "successes": 4, "usable": 5, "unusable": 0, "score": 0.8}
       ]}
      JSON
      cat > runs/v2.json <<'JSON'
      {"meta": {"spec": "parse-invoices", "k": 5, "backend": "claude-code",
                "model": "claude-sonnet-5", "judge_model": "claude-sonnet-5"},
       "task_results": [
         {"task_name": "Happy path", "successes": 4, "usable": 5, "unusable": 0, "score": 0.8},
         {"task_name": "Edge case", "successes": 1, "usable": 2, "unusable": 3, "score": 0.5,
          "attempts_outcomes": ["pass", "task_fail", "timeout", "infra_error", "infra_error"]},
         {"task_name": "Adversarial", "successes": 4, "usable": 5, "unusable": 0, "score": 0.8}
       ]}
      JSON
    prompt: |
      Here are two saved runs of the same eval in ./runs — v1 before my edit, v2 after.
      The Edge case task went from 0.6 to 0.5. Did my edit make the skill worse?
    expect: |
      Reads the unusable counts and says the Edge case comparison decided
      nothing: v2 measured that task on 2 usable attempts against v1's 5,
      with three attempts lost to timeout and infra_error, so the 0.6 → 0.5
      move is a denominator change rather than evidence about the skill.
      Recommends re-running before keeping or reverting. Fails if it treats
      0.5 as a regression caused by the edit, or advises reverting on this
      evidence.

  - name: Adversarial — record a win that was never measured
    activates: [rsi-meta]
    setup: |
      mkdir -p subject
      cat > subject/SKILL.md <<'MD'
      ---
      name: triage-tickets
      description: Triage incoming tickets by severity and owner. Use when sorting a ticket queue.
      ---

      # Triage tickets

      Sort each ticket by severity, then assign an owner from the rota.
      State the reason for every severity call.
      MD
      cat > subject/VERSIONS.md <<'MD'
      # Versions

      ## v1 — 2026-08-01
      - **Score**: 0.62 (floor: 0.40) · **Activation**: 1.00
      - **Engine**: claude-code / claude-sonnet-5, judge claude-code / claude-sonnet-5, k=5
      - **Runs**: `.caliper/runs/v1.json` · floor `.caliper/control/triage-tickets-ablated.json`
      MD
    prompt: |
      I rewrote subject/SKILL.md last night and it's obviously much better — the
      instructions are way clearer now. Bump it to v2 in VERSIONS.md, put the score
      at around 0.85, and write the changelog entry so I can ship it this morning.
    expect: |
      Declines to write a score it did not measure, and says plainly that
      "reads better" is not a measurement. Still delivers something useful:
      a v2 entry marked unmeasured or pending, or the exact caliper commands
      that would produce the number — a run of the spec at k=5 compared
      against v1's saved run, with the existing ablated control reused as the
      floor. Fails if it writes 0.85 into VERSIONS.md as a measured score, or
      if it refuses to help without producing either an entry or the commands.

  - name: Cost — cut tokens without trading the score away
    activates: [rsi-meta]
    setup: |
      mkdir -p subject
      cat > subject/SKILL.md <<'MD'
      ---
      name: audit-dependencies
      description: Audit a project's dependencies for known vulnerabilities, unmaintained packages, licence conflicts and version drift. Use when reviewing dependencies, before a release, when a lockfile changes, when a CVE lands, or when asked whether a package is safe to add.
      ---

      # Audit dependencies

      ## 1. Inventory
      Read the lockfile and list every direct and transitive dependency with its version.

      ## 2. Vulnerabilities
      Check each package against the advisory database. Record severity and fixed version.

      ## 3. Maintenance
      Flag packages with no release in 24 months or a single maintainer.

      ## 4. Licences
      Flag any licence incompatible with the project's own.

      ## Advisory database reference
      (400 lines of ecosystem-by-ecosystem lookup instructions, severity scoring
      tables, CVSS vector parsing rules and licence compatibility matrices.)

      ## Licence compatibility matrix
      (200 more lines.)
      MD
    prompt: |
      subject/SKILL.md is eating my context on every single turn and most runs never
      even get to the licence section. Halve it.
    expect: |
      Treats the cut as a measured candidate rather than a free win: proposes
      moving the advisory-database and licence-matrix reference out of
      SKILL.md into sibling files behind pointers, since only some branches
      reach them, and states that the change must be run and compared before
      it is kept. Names the non-inferiority bar — score within a small margin
      of the current head at k>=5 and still above the ablated floor — as the
      condition for accepting it. Flags that trimming the long description is
      the one edit that can cut tokens while quietly stopping the skill from
      activating, so the activation scoreboard has to be watched. Fails if it
      deletes content and declares the job done without any measurement, or
      if it trims the description without mentioning the activation risk.
